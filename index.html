<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kendo Shinpan Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; touch-action: none; font-family: 'Inter', sans-serif; }
      #app { width: 100vw; height: 100vh; position: relative; }
      /* Custom Slider */
      input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #bc002d; cursor: pointer; transition: transform 0.1s; }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
      /* Custom Checkbox */
      .form-checkbox { accent-color: #bc002d; }
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(188, 0, 45, 0.8); }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="kendoCanvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair touch-none"></canvas>

      <!-- Main Mode Toggle -->
      <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 bg-black/60 backdrop-blur-md border border-white/10 rounded-full p-1 flex items-center shadow-2xl">
        <button id="btn-mode-tech" class="px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-white bg-[#bc002d] shadow-lg transition cursor-pointer">Modo Técnico</button>
        <button id="btn-mode-rpg" class="px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-white transition cursor-pointer">Modo Renderizado</button>
      </div>

      <!-- Simulation / Procedure Mode Switcher -->
      <div class="absolute top-16 left-1/2 -translate-x-1/2 z-20 bg-black/60 backdrop-blur-md border border-white/10 rounded-full p-1 flex items-center shadow-2xl gap-1">
        <button id="btn-sim-combat" class="px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider text-white bg-[#2563eb] shadow-md transition cursor-pointer flex items-center gap-1.5">
          <i class="fas fa-fist-raised"></i> <span id="ui-sim-combat">Combate Reativo</span>
        </button>
        <button id="btn-sim-procedure" class="px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-white transition cursor-pointer flex items-center gap-1.5">
          <i class="fas fa-scroll"></i> <span id="ui-sim-procedure">Procedimentos FIK</span>
        </button>
      </div>

      <!-- Top-Right Floating Help Button -->
      <button id="help-btn" class="absolute top-4 right-4 p-2.5 px-3.5 bg-black/60 backdrop-blur-md rounded-full shadow-2xl border border-white/10 text-gray-300 hover:text-white hover:bg-black/80 transition flex items-center gap-2 z-20 text-xs font-semibold cursor-pointer" title="Ajuda & Diretrizes">
        <i class="fas fa-question-circle text-sm text-[#bc002d]"></i>
        <span class="hidden sm:inline" id="ui-help-btn-label">Ajuda</span>
      </button>

      <!-- Glass Panel Controls -->
      <div id="controls-container" class="absolute top-4 left-4 w-[340px] max-h-[90vh] rounded-xl shadow-2xl flex flex-col z-10 transition-transform duration-300 bg-black/50 backdrop-blur-2xl border border-white/10 text-gray-300 overflow-hidden">
        
        <!-- FROZEN / STICKY HEADER -->
        <div class="flex-shrink-0 p-4 border-b border-white/10 flex flex-col gap-2 bg-white/5 rounded-t-xl">
          <div class="flex justify-between items-center">
            <h1 id="ui-app-title" class="text-lg font-bold text-white m-0 leading-none">Kendo Shinpan</h1>
            <div class="flex items-center gap-2">
              <button id="panel-help-btn" class="text-gray-400 hover:text-white transition p-1 text-sm cursor-pointer" title="Ajuda">
                <i class="fas fa-question-circle"></i>
              </button>
              <button id="toggle-panel-btn" class="text-gray-400 hover:text-white transition p-1 cursor-pointer">
                <i class="fas fa-chevron-left"></i>
              </button>
            </div>
          </div>
          <div class="flex justify-between items-center text-sm text-gray-400 mt-2">
            <span id="ui-lang-label" class="font-medium"><i class="fas fa-language"></i> Idioma</span>
            <select id="lang-select" class="p-1 rounded border border-white/20 bg-black/50 text-white focus:outline-none cursor-pointer">
              <option value="pt">Português</option>
              <option value="en">English</option>
              <option value="jp">日本語</option>
            </select>
          </div>
          <div class="flex justify-between items-center text-sm text-gray-400 mt-2">
            <span id="ui-court-label" class="font-medium"><i class="fas fa-ruler-combined"></i> Dimensão da Quadra</span>
            <select id="court-select" class="p-1 rounded border border-white/20 bg-black/50 text-white focus:outline-none cursor-pointer">
              <option value="9">9 x 9 m</option>
              <option value="10" selected>10 x 10 m</option>
              <option value="11">11 x 11 m</option>
            </select>
          </div>
        </div>

        <!-- SCROLLABLE BODY -->
        <div class="p-4 flex-1 overflow-y-auto space-y-4 custom-scrollbar">
          <!-- Description -->
          <p id="ui-description" class="text-[13px] leading-tight text-gray-400"></p>

          <!-- Adaptive Legend -->
          <div id="legend-container" class="bg-white/5 p-3 rounded-lg text-[13px] border border-white/10">
            <div id="ui-label-legend" class="font-bold mb-2 uppercase text-[11px] text-gray-500 tracking-wider"></div>
            
            <!-- Technical Legend -->
            <div id="tech-legend" class="grid grid-cols-2 gap-2">
              <div class="flex items-center"><span class="w-3 h-3 rounded-full mr-2 bg-white border border-gray-800"></span><span id="ui-leg-white"></span></div>
              <div class="flex items-center"><span class="w-3 h-3 rounded-full mr-2 bg-[#bc002d]"></span><span id="ui-leg-red"></span></div>
              <div class="flex items-center"><span class="w-3 h-3 rounded-full mr-2 bg-[#2563eb]"></span><span id="ui-leg-s"></span></div>
              <div class="flex items-center"><span class="w-3 h-3 rounded-full mr-2 bg-[#fbbf24]"></span><span id="ui-leg-f1"></span></div>
              <div class="flex items-center col-span-2"><span class="w-3 h-3 rounded-full mr-2 bg-[#22c55e]"></span><span id="ui-leg-f2"></span></div>
            </div>

            <!-- Rendered Legend (Adaptive) -->
            <div id="rendered-legend" class="hidden space-y-2">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-white border border-gray-500"></span>
                <span id="ui-leg-kenshi-shiro" class="text-xs text-gray-300"></span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#bc002d]"></span>
                <span id="ui-leg-kenshi-aka" class="text-xs text-gray-300"></span>
              </div>
              <div class="flex items-center gap-2 pt-1 border-t border-white/10">
                <i class="fas fa-flag text-xs text-gray-400"></i>
                <span id="ui-leg-shinpan-trio" class="text-xs text-gray-300"></span>
              </div>
            </div>
          </div>

          <!-- Advanced Parameters (Directly open in Technical Mode, Hidden in Rendered Mode) -->
          <div id="tech-advanced-section" class="bg-white/5 p-3 rounded-lg border border-white/10 text-sm space-y-3.5">
            <div class="flex items-center justify-between border-b border-white/10 pb-1.5">
              <span class="font-bold text-xs uppercase tracking-wider text-white">
                <i class="fas fa-sliders-h mr-1.5 text-[#bc002d]"></i> <span id="ui-advanced-title">Parâmetros</span>
              </span>
            </div>

            <!-- Movimento: Suavização (k) -->
            <div>
              <div id="ui-advanced-section-motion" class="font-bold text-[11px] uppercase text-gray-500 mb-1"></div>
              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-smooth-label"></span>
                  <span id="val-smooth" class="font-mono text-white font-semibold">5.0</span>
                </div>
                <input id="slide-smooth" type="range" min="1" max="15" step="0.5" value="5.0" class="w-full">
              </div>
            </div>

            <!-- Thresholds de Transição: 5 sliders -->
            <div class="space-y-2.5">
              <div id="ui-advanced-section-thresholds" class="font-bold text-[11px] uppercase text-gray-500 mb-1"></div>
              
              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-th-enter-vertex"></span>
                  <span id="val-enter-vertex" class="font-mono text-white font-semibold">90°</span>
                </div>
                <input id="slide-enter-vertex" type="range" min="40" max="110" step="1" value="90" class="w-full">
              </div>

              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-th-exit-vertex"></span>
                  <span id="val-exit-vertex" class="font-mono text-white font-semibold">45°</span>
                </div>
                <input id="slide-exit-vertex" type="range" min="10" max="80" step="1" value="45" class="w-full">
              </div>

              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-th-enter-sbase"></span>
                  <span id="val-enter-sbase" class="font-mono text-white font-semibold">123°</span>
                </div>
                <input id="slide-enter-sbase" type="range" min="100" max="150" step="1" value="123" class="w-full">
              </div>

              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-th-exit-sbase"></span>
                  <span id="val-exit-sbase" class="font-mono text-white font-semibold">90°</span>
                </div>
                <input id="slide-exit-sbase" type="range" min="70" max="130" step="1" value="90" class="w-full">
              </div>

              <div class="space-y-1">
                <div class="flex justify-between text-xs">
                  <span id="ui-th-enter-flip"></span>
                  <span id="val-enter-flip" class="font-mono text-white font-semibold">135°</span>
                </div>
                <input id="slide-enter-flip" type="range" min="110" max="170" step="1" value="135" class="w-full">
              </div>
            </div>

            <div id="ui-advanced-note" class="text-[11px] text-gray-500 leading-tight"></div>
          </div>

          <!-- Tip -->
          <div class="bg-[#bc002d]/10 text-white p-3 rounded-lg text-sm border border-[#bc002d]/20">
            <strong><i class="fas fa-lightbulb text-[#bc002d] mr-1"></i> <span id="ui-tip-title"></span>:</strong>
            <span id="ui-tip-body" class="block mt-1 text-gray-300"></span>
          </div>

          <!-- Debug Panel (Only in Technical Mode) -->
          <div id="debug-panel" class="bg-black/80 text-green-400 p-3 rounded-lg text-xs font-mono space-y-1 shadow-inner border border-white/10">
            <div class="text-gray-500 mb-2 font-bold uppercase text-[10px]" id="ui-label-angles"></div>
            <div class="flex justify-between"><span id="ui-angle-combat"></span><span id="debug-angle" class="text-white">0°</span></div>
            <div class="flex justify-between"><span id="ui-mode-label"></span><span id="debug-mode" class="text-white">STANDARD</span></div>
            <div class="flex justify-between"><span id="ui-flag-label"></span><span id="debug-flag" class="text-white">1</span></div>
            <div class="flex justify-between"><span id="ui-freeze-label"></span><span id="debug-freeze" class="text-white">STABLE</span></div>
            <div class="mt-2 border-t border-white/20 pt-2 space-y-1">
              <div class="flex justify-between"><span id="ui-ref-s"></span><span id="debug-s" class="text-white">0°</span></div>
              <div class="flex justify-between"><span id="ui-ref-f1"></span><span id="debug-f1" class="text-white">0°</span></div>
              <div class="flex justify-between"><span id="ui-ref-f2"></span><span id="debug-f2" class="text-white">0°</span></div>
            </div>
          </div>
        </div>

        <!-- FROZEN / STICKY FOOTER / RESET -->
        <div class="flex-shrink-0 p-3 bg-black/60 border-t border-white/10 rounded-b-xl">
          <button id="reset-btn" class="w-full bg-[#bc002d] hover:bg-red-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fas fa-undo-alt"></i> <span id="ui-btn-reset"></span>
          </button>
        </div>
      </div>
      
      <!-- Open Panel Button -->
      <button id="open-panel-btn" class="absolute top-4 left-4 p-3 bg-black/50 backdrop-blur-md rounded-lg shadow-lg border border-white/10 hidden hover:bg-black/70 transition z-20 cursor-pointer" title="Abrir Configurações">
        <i class="fas fa-cog text-white"></i>
      </button>

      <!-- Floating Reset Button (Visible when panel is collapsed) -->
      <button id="floating-reset-btn" class="absolute top-16 left-4 p-3 bg-black/50 backdrop-blur-md rounded-lg shadow-lg border border-white/10 hidden hover:bg-black/70 text-gray-300 hover:text-white transition z-20 cursor-pointer" title="Resetar Posições">
        <i class="fas fa-undo-alt text-[#bc002d]"></i>
      </button>

      <!-- HELP MODAL OVERLAY -->
      <div id="help-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-[#18181b]/95 border border-white/20 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col text-gray-200 overflow-hidden">
          
          <!-- Modal Header -->
          <div class="p-4 px-6 border-b border-white/10 flex justify-between items-center bg-white/5">
            <div class="flex items-center gap-2.5">
              <i class="fas fa-book-open text-[#bc002d] text-lg"></i>
              <h2 id="help-modal-title" class="text-base font-bold text-white m-0">Guia do Simulador & Fundamentos</h2>
            </div>
            <button id="help-modal-close" class="text-gray-400 hover:text-white p-1 transition text-lg cursor-pointer">
              <i class="fas fa-times"></i>
            </button>
          </div>

          <!-- Tabs Navigation -->
          <div class="flex overflow-x-auto gap-1 p-2 px-4 border-b border-white/10 bg-black/40 text-xs font-semibold custom-scrollbar">
            <button class="help-tab-btn px-3 py-1.5 rounded-lg bg-[#bc002d] text-white transition whitespace-nowrap cursor-pointer" data-tab="usage" id="tab-btn-usage">Como Usar</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="modes" id="tab-btn-modes">Modos de Visão</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="viz" id="tab-btn-viz">Zonas & Geometria</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="advanced" id="tab-btn-advanced">Parâmetros</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="scenarios" id="tab-btn-scenarios">Cenários</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="concept" id="tab-btn-concept">Conceito Marcial</button>
            <button class="help-tab-btn px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition whitespace-nowrap cursor-pointer" data-tab="disclaimer" id="tab-btn-disclaimer">Disclaimer & Regras</button>
          </div>

          <!-- Modal Body Content -->
          <div id="help-tab-content" class="flex-1 overflow-y-auto p-6 text-sm leading-relaxed text-gray-300 custom-scrollbar">
            <!-- Content injected dynamically via main.ts -->
          </div>

          <!-- Modal Footer -->
          <div class="p-3 px-6 bg-black/40 border-t border-white/10 flex justify-end">
            <button id="help-modal-bottom-close" class="px-5 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium text-xs transition cursor-pointer">
              Fechar Guia
            </button>
          </div>
        </div>
      </div>

      <!-- FLOATING SCENARIOS WIDGET (Option A) -->
      <div id="scenarios-widget" class="fixed bottom-7 right-4 z-20 flex flex-col items-end select-none">
        
        <!-- Expanded Card (Initially Hidden) -->
        <div id="scenarios-expanded" class="hidden mb-2 bg-[#18181b]/95 backdrop-blur-md border border-white/15 rounded-xl shadow-2xl p-3 w-72 text-gray-200 transition-all">
          <div class="flex items-center justify-between pb-2 border-b border-white/10 mb-2">
            <span class="font-bold text-xs uppercase tracking-wider text-white flex items-center gap-1.5">
              <i class="fas fa-play-circle text-[#bc002d]"></i> <span id="ui-scenarios-expanded-title">Cenários de Teste</span>
            </span>
            <div class="flex items-center gap-1">
              <button id="scenario-stop-btn-expanded" class="p-1 px-2 text-[11px] bg-red-950/70 hover:bg-red-900 border border-red-700/50 text-red-300 rounded cursor-pointer transition flex items-center gap-1" title="Parar Cenário">
                <i class="fas fa-stop text-[10px]"></i> <span id="ui-stop-label-expanded">Parar</span>
              </button>
              <button id="scenarios-collapse-btn" class="text-gray-400 hover:text-white p-1 text-xs cursor-pointer transition" title="Recolher">
                <i class="fas fa-chevron-down"></i>
              </button>
            </div>
          </div>
          <!-- Full Scenario Buttons List -->
          <div id="scenario-expanded-list" class="space-y-1 max-h-60 overflow-y-auto custom-scrollbar pr-0.5">
            <!-- Buttons injected dynamically -->
          </div>
        </div>

        <!-- Compact Pill Bar -->
        <div id="scenarios-compact" class="flex items-center gap-1.5 bg-black/60 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-1.5 shadow-xl transition-all">
          <span class="text-[11px] font-semibold text-gray-400 pl-1 flex items-center gap-1">
            <i class="fas fa-play text-[#bc002d] text-[10px]"></i> <span id="ui-scenarios-compact-title" class="hidden sm:inline">Cenários:</span>
          </span>
          <div id="scenario-chips" class="flex items-center gap-1">
            <!-- Chips injected dynamically (1A, 1B, 1C, 1D, 2, 3, 4, 5) -->
          </div>
          <button id="scenario-stop-btn-compact" class="w-6 h-6 rounded-full bg-red-950/70 hover:bg-red-900 border border-red-700/50 text-red-300 flex items-center justify-center text-[10px] cursor-pointer transition ml-0.5" title="Parar Cenário">
            <i class="fas fa-stop"></i>
          </button>
          <button id="scenarios-expand-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white flex items-center justify-center text-[10px] cursor-pointer transition" title="Ver Lista Completa">
            <i class="fas fa-chevron-up"></i>
          </button>
        </div>

      </div>

      <!-- DOCKED PROCEDURE PANEL (RIGHT SIDEBAR) -->
      <div id="procedure-widget" class="hidden fixed top-16 right-4 z-20 w-[350px] max-h-[85vh] bg-[#18181b]/95 backdrop-blur-2xl border border-white/15 rounded-2xl shadow-2xl p-4 text-gray-200 flex flex-col gap-3 select-none transition-all overflow-hidden">
        
        <!-- Header & Chapter Selector -->
        <div class="flex items-center justify-between pb-2.5 border-b border-white/10 flex-shrink-0">
          <div class="flex items-center gap-2">
            <i class="fas fa-scroll text-[#bc002d]"></i>
            <span class="font-bold text-xs uppercase tracking-wider text-white" id="ui-proc-header">Procedimentos FIK</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="proc-speed-btn" class="px-2 py-1 bg-white/10 hover:bg-white/20 border border-white/10 rounded-md text-[11px] font-mono text-gray-300 hover:text-white transition cursor-pointer" title="Velocidade">
              <span id="proc-speed-val">1.0x</span>
            </button>
            <button id="proc-minimize-btn" class="text-gray-400 hover:text-white p-1 text-xs transition cursor-pointer" title="Minimizar">
              <i class="fas fa-minus"></i>
            </button>
            <button id="proc-close-btn" class="text-gray-400 hover:text-white p-1 text-sm transition cursor-pointer" title="Voltar ao Combate">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- Chapter Tabs (Vertical List) -->
        <div class="flex flex-col gap-1 flex-shrink-0" id="proc-chapter-tabs">
          <button class="proc-chapter-btn text-left py-1.5 px-3 rounded-lg text-xs font-semibold whitespace-nowrap bg-[#bc002d] text-white transition cursor-pointer" data-chapter="entry" id="tab-chap-entry">1. Entrada & Formação</button>
          <button class="proc-chapter-btn text-left py-1.5 px-3 rounded-lg text-xs font-semibold whitespace-nowrap bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition cursor-pointer" data-chapter="rotation" id="tab-chap-rotation">2. Rotação Regular (Sem Troca)</button>
          <button class="proc-chapter-btn text-left py-1.5 px-3 rounded-lg text-xs font-semibold whitespace-nowrap bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition cursor-pointer" data-chapter="exit" id="tab-chap-exit">3. Encerramento & Saída</button>
        </div>

        <!-- Canonical Procedure Options (Seats Side & Rotation Variant) -->
        <div class="grid grid-cols-2 gap-2 p-2 bg-white/5 border border-white/10 rounded-xl flex-shrink-0 text-[11px]">
          <!-- Seats Side Toggle -->
          <div class="flex flex-col gap-1">
            <span class="text-[10px] text-gray-400 font-semibold" id="ui-proc-seats-label">Assentos (Mesa):</span>
            <div class="grid grid-cols-2 gap-1 bg-black/40 p-0.5 rounded-lg border border-white/5">
              <button id="proc-seat-left-btn" class="py-1 px-1.5 rounded text-center font-bold bg-[#bc002d] text-white transition cursor-pointer text-[10px]">Esquerda</button>
              <button id="proc-seat-right-btn" class="py-1 px-1.5 rounded text-center font-medium text-gray-400 hover:text-white transition cursor-pointer text-[10px]">Direita</button>
            </div>
          </div>
          <!-- Rotation Variant Toggle -->
          <div class="flex flex-col gap-1">
            <span class="text-[10px] text-gray-400 font-semibold" id="ui-proc-rot-label">Modo Rotação:</span>
            <div class="grid grid-cols-2 gap-1 bg-black/40 p-0.5 rounded-lg border border-white/5">
              <button id="proc-rot-reg-btn" class="py-1 px-1.5 rounded text-center font-bold bg-[#bc002d] text-white transition cursor-pointer text-[10px]">Regular</button>
              <button id="proc-rot-koutai-btn" class="py-1 px-1.5 rounded text-center font-medium text-gray-400 hover:text-white transition cursor-pointer text-[10px]">Troca</button>
            </div>
          </div>
        </div>

        <!-- Step Info Card -->
        <div class="bg-black/40 border border-white/10 rounded-xl p-3 flex flex-col gap-2 overflow-y-auto custom-scrollbar flex-1">
          <div class="flex items-center justify-between">
            <span id="proc-step-counter" class="text-[11px] font-bold uppercase tracking-wider text-blue-400">Passo 1 de 6</span>
            <span id="proc-command-badge" class="hidden px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-blue-600/30 text-blue-300 border border-blue-500/40">Mae!</span>
          </div>
          <p id="proc-step-desc" class="text-xs text-gray-300 leading-relaxed m-0 min-h-[40px]"></p>
          
          <!-- Progress Bar -->
          <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden mt-1 flex-shrink-0">
            <div id="proc-progress-fill" class="bg-[#bc002d] h-full transition-all duration-100" style="width: 0%"></div>
          </div>
        </div>

        <!-- Media & Navigation Controls -->
        <div class="flex flex-col gap-2 pt-1 flex-shrink-0 border-t border-white/10">
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer select-none">
              <input type="checkbox" id="proc-pause-step-chk" checked class="form-checkbox rounded">
              <span id="ui-proc-pause-step" class="text-[11px] text-gray-400">Pausar a cada etapa</span>
            </label>
            <button id="proc-reset-btn" class="p-1 px-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 hover:text-white flex items-center gap-1 text-[11px] transition cursor-pointer" title="Reiniciar Capítulo">
              <i class="fas fa-undo text-[10px]"></i> <span>Reiniciar</span>
            </button>
          </div>

          <div class="grid grid-cols-3 gap-1.5">
            <button id="proc-prev-btn" class="py-2 px-2 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 text-white font-semibold text-xs flex items-center justify-center gap-1 transition cursor-pointer" title="Etapa Anterior">
              <i class="fas fa-step-backward"></i> <span id="ui-proc-prev">Anterior</span>
            </button>
            <button id="proc-play-btn" class="py-2 px-2 rounded-lg bg-[#bc002d] hover:bg-red-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-lg transition transform active:scale-95 cursor-pointer">
              <i class="fas fa-play" id="proc-play-icon"></i> <span id="ui-proc-play">Reproduzir</span>
            </button>
            <button id="proc-next-btn" class="py-2 px-2 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 text-white font-semibold text-xs flex items-center justify-center gap-1 transition cursor-pointer" title="Próxima Etapa">
              <span id="ui-proc-next">Próximo</span> <i class="fas fa-step-forward"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- COMPACT MINIMIZED PROCEDURE PILL -->
      <div id="proc-minimized-pill" class="hidden fixed top-16 right-4 z-20 flex items-center gap-1.5 bg-black/70 backdrop-blur-md border border-white/15 rounded-full px-3 py-1.5 shadow-2xl transition-all select-none">
        <i class="fas fa-scroll text-[#bc002d] text-xs mr-0.5"></i>
        <span id="proc-mini-counter" class="text-[11px] font-bold text-blue-400 mr-1.5">1/6</span>
        <button id="proc-mini-prev-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs transition cursor-pointer" title="Anterior">
          <i class="fas fa-step-backward text-[9px]"></i>
        </button>
        <button id="proc-mini-play-btn" class="w-6 h-6 rounded-full bg-[#bc002d] hover:bg-red-800 text-white flex items-center justify-center text-xs transition cursor-pointer shadow-md" title="Reproduzir / Pausar">
          <i class="fas fa-play text-[9px]" id="proc-mini-play-icon"></i>
        </button>
        <button id="proc-mini-next-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs transition cursor-pointer" title="Próximo">
          <i class="fas fa-step-forward text-[9px]"></i>
        </button>
        <div class="h-4 w-px bg-white/20 mx-0.5"></div>
        <button id="proc-expand-btn" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white flex items-center justify-center text-xs transition cursor-pointer" title="Expandir Painel">
          <i class="fas fa-chevron-left text-[9px]"></i>
        </button>
      </div>

      <div id="ui-author" class="fixed right-3 bottom-2 text-[11px] text-white/50 pointer-events-none z-0"></div>
    </div>
  </body>
</html>
