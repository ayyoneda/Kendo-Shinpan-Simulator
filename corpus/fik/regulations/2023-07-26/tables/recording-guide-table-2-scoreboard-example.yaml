      win_type: hikiwake
      points:
        white: 1
        red: 1
    score_frame:
      white_area:
        marks_outer_to_center:
          - mark_id: white_hansoku_ippon
            code: "H"
            enclosure: circle
            fill: empty
            meaning: "Hansoku ippon"
      center_marks:
        - mark_id: hikiwake
          code: "X"
          enclosure: none
          meaning: "Hikiwake"
      red_area:
        marks_outer_to_center:
          - mark_id: red_men
