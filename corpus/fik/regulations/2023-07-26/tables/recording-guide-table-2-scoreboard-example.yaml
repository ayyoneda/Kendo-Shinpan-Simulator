result: "Team Red Wins by a Margin of 3 Matches to 1."
notes:
  - Mark shapes and example results were corrected after repository-owner PDF review comments.
  - Within each player's score area, scoring marks are recorded from the outer/player-name side toward the center.
  - Hansoku triangles are placed closest to the relevant player's name when present.
  - In the Senpo example, the square 1 is placed to the left of the circled M for the red player; a white-player Ippon-gachi equivalent would be placed to the right of the first point mark.
