official_caption: "An Example of Scoreboard Use for Dantai-shiai"
mark_schema:
  code: "Visible letter, numeral, or symbol inside the mark; null when the mark has no internal code."
  enclosure: "circle, square, rectangle, or none."
  shape: "triangle is used for Hansoku marks."
  fill: "empty or solid."
  color: "Mark color when specified by the source table."
  placement: "Visual placement relative to the score frame when relevant."
fields:
  referees:
    shushin: "[Shushin Name]"
    fukushin:
      - "[Fukushin 1 Name]"
      - "[Fukushin 2 Name]"
  teams:
    white:
      side: "left"
      score_area: white_area
    red:
      side: "right"
      score_area: red_area
rounds:
  - order: "Senpo"
    white_player: "[Player Name]"
    white_result: null
    result:
      winner: red
      win_type: ippon-gachi
      points:
        white: 0
        red: 1
    score_frame:
      white_area:
        marks_outer_to_center: []
      center_marks: []
      red_area:
        marks_outer_to_center:
          - mark_id: red_ippon_gachi
            code: "1"
            enclosure: square
            fill: empty
            meaning: "Ippon-gachi"
            placement: "Placed to the left of the circled M in the source table because the point belongs to the red player."
          - mark_id: red_men
            code: "M"
            enclosure: circle
            fill: empty
            meaning: "Men"
    red_player: "[Player Name]"
    red_result: "winner"
  - order: "Jiho"
    white_player: "[Player Name]"
    white_result: null
    result:
      winner: red
      win_type: hantei
      points:
        white: 0
        red: 0
    score_frame:
      white_area:
        marks_outer_to_center: []
      center_marks:
        - mark_id: encho
          code: "E"
          enclosure: rectangle
          fill: empty
          meaning: "Encho; the result occurred during time extension."
      red_area:
        marks_outer_to_center:
          - mark_id: red_hantei
            code: "Ht"
            enclosure: circle
            fill: empty
            meaning: "Victory by Hantei"
    red_player: "[Player Name]"
    red_result: "winner"
  - order: "Chuken"
    white_player: "[Player Name]"
    white_result: "winner"
    result:
      winner: white
      win_type: fusen-gachi
      points:
        white: 2
        red: 0
    score_frame:
      white_area:
        marks_outer_to_center:
          - mark_id: white_fusen_gachi_points
            code: null
            enclosure: circle
            fill: empty
            count: 2
            meaning: "Fusen-gachi; two empty circles on the winner side."
      center_marks: []
      red_area:
        marks_outer_to_center: []
    red_player: "[Player Name]"
    red_result: null
  - order: "Fukusho"
    white_player: "[Player Name]"
    white_result: "draw"
    result:
