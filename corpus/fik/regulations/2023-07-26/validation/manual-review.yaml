instructions:
- Use the PDF as the authority.
- Fill pdf_pages with the PDF page numbers checked.
- Set status to reviewed_ok only after checking the item against the PDF.
- If a problem is found, add an entry under issues and set the affected item to issues_found.
- After a correction is made, change the affected item to corrected_pending_recheck until it is checked again.
