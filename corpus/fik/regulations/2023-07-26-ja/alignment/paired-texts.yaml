    text_sha256: 004c437aa3b900629e67fdb880a921dbbe61fa736c0c44267b94b4de30df65f3
    text: '**第31条:** 試合を棄権した者は、負けとし、その後の試合に出場することができない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000031
    source_pdf_pages:
    - 23
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000031
    text_sha256: 135111b8f7a12027fdd7cf7c1e64cadc99feda6433f89d143b31c77e423ebed9
    text: '**Article 31:** A *shiai-sha* who has defaulted during a *shiai* will be the loser and be prohibited from participating
      in following *shiai*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000031
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000032
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000032
  node_type: article
  local_number: '32'
  japanese_title: 試合不能者・棄権者の既得本数
  english_title: Points Gained by Shiai-funo-sha or Kiken-sha
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000032
    text_sha256: e3a77641a8080408e90b37d2517c2e72edb8fc710da291b6e0fe35fd2ac007e2
    text: '**第32条:** 第30条、第31条による勝者は、２本勝ちとし、試合不能者の既得の１本は有効とする。ただし、延長戦の場合は、勝者に１本を与える。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000032
    source_pdf_pages:
    - 23
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000032
    text_sha256: 403489dea7a61b3f8b6a7c582ae1b81b95ab22f8fc96bf7bf67bb490faa471c8
    text: '**Article 32:** The winner by virtue of Articles 30 or 31 shall be given two points. Any point scored by the *shiai-funo-sha*
      shall remain valid. However, the winner will be awarded one point in the case of *encho*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000032
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000033
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000033
  node_type: article
  local_number: '33'
  japanese_title: 加害者の既得本数、既得権
  english_title: Points or acquired Status of the Offender
  japanese:
