- alignment_id: alignment:kkp:article:fik.regulations:000006
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000006
  node_type: article
  local_number: '6'
  japanese_title: 試合時間
  english_title: Duration of Shiai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000006
    text_sha256: 0938df3698789340b96935ec08c892fc5bebc913acf4cd13ae00244ab01d1890
    text: '**第6条:** 試合時間は、５分を基準とし、延長の場合は３分を基準とする。ただし、主審が有効打突または試合の中止を宣告したとき、再開までに要した時間は、試合時間に含まない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000006
    source_pdf_pages:
    - 9
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000006
    text_sha256: 79fb9b2e0406b7887b3d8e13c6043eec6cd1f1ac7f975991e218404b8f261008
    text: '**Article 6:** The standard duration for *shiai* shall be five minutes, and *encho* shall be three minutes. The
      time from the *senkoku* for *yuko-datotsu* or suspension pronounced by the *shushin*, until resumption of the *shiai*,
      shall not be counted in the *shiai* duration.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000006
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000007
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000007
  node_type: article
  local_number: '7'
  japanese_title: 勝敗の決定
  english_title: Decision of Victory
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000007
    text_sha256: 03dbe55124b4cd51afd626b47b31085ee1e2fa111aea64b76113b6a997a334ae
    text: '**第7条:** 勝敗の決定は、次により行う。


      １．試合は、３本勝負を原則とする。ただし、運営上必要な場合は１本勝負とすることができる。


      ２．勝敗は、試合時間内に２本先取した者を勝ちとする。ただし、一方が１本を取り、そのままで試合時間が終了したときは、この者を勝ちとする。


      ３．試合時間内に勝敗が決しない場合は、延長戦を行い、先に１本取った者を勝ちとする。ただし、判定または抽選により勝敗を決め、あるいは、引き分けとすることもできる。


      ４．判定または抽選により勝敗を決した場合は、その勝者に対して１本を与える。


      ５．判定により勝敗を決する場合は、技能の優劣を優先し、次いで試合態度の良否により、判定する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000007
    source_pdf_pages:
    - 9
    - 10
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000007
    text_sha256: 7fd2b7bf44e4b3717dcce718029ec8c6a48d17da4053e33a250635c832f7e147
    text: '**Article 7:** Victory in *shiai* shall be decided in accordance with the following rules:

      1. In principle, victory shall be decided in accordance with the *sanbon-shobu* rule; however, it may be decided in
      accordance with the *ippon-shobu* rule depending on the managerial needs for each tournament.

      2. In *sanbon-shobu*, the *shiai-sha* who first scores two points within the *shiai* duration shall be the winner. However,
      if a *shiai-sha* scores one point without allowing the other any point within the *shiai* duration, the former shall
      be the winner.

      3. In case victory has not been decided within the *shiai* duration, *encho* may be employed wherein the *shiai-sha*
      who first scores one point shall be the winner. Otherwise, victory may be decided by *hantei* or by *chusen*, or the
      *shiai* may be declared a *hikiwake*.

      4. In case victory has been decided by *hantei* or by *chusen*, the winner shall be awarded one point.

      5. In the case of *hantei*, *shinpan-in* shall take into consideration, first the skills of the *shiai-sha*, then their
      attitude in the *shiai*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000007
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000008
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000008
  node_type: article
  local_number: '8'
  japanese_title: 団体試合
  english_title: Dantai-shiai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000008
    text_sha256: 4ff704ca1db3f55fbd364cc908413bab48f743df61c69f3774ec8977c817cebb
    text: '**第8条:** 団体試合は、次によるほか、その大会で定められた方法により行い、勝敗を決する。


      １．勝者数法は、勝者の数によって団体の勝敗を決する。ただし、勝者が同数の場合は、総本数の多い方を勝ちとする。なお、総本数が同数の場合は、代表者戦によって勝敗を決する。


      ２．勝抜き法は、勝者が続けて試合を行い団体の勝敗を決する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000008
    source_pdf_pages:
    - 10
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000008
    text_sha256: 0d09d4d0280169cfc4a402c40c458705ee48b313fabcc4b397bed597278b4ee8
    text: '**Article 8:** *Dantai-shiai* shall be carried out in accordance with the following rules; however, the rules may
      be modified at each tournament if necessary:

      1. The team which has more winners than the other shall be the victor. In the case where the number of winners turns
      out to be equal, the team which has scored more points than the other shall be the victor. Furthermore, in case the
      number of scored points happens to be equal, one *daihyosha* from each team shall fight to decide the match.

      2. In the case of the *kachinuki* method, the *shiai-sha* continues to fight for as long as he or she keeps winning.
      The team which defeats the last *shiai-sha* of the opponent''s team shall be the victor.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000008
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
