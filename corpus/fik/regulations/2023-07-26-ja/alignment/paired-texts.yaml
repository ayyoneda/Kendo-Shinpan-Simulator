    text_sha256: c0d7b23bb7410601d24a8dd1b0002a76b9819c7d312e2a604bf4051ef4f062d4
    text: '**第33条:** 第30条２号の加害者として負けとされた者の、既得本数、既得権は認めない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000033
    source_pdf_pages:
