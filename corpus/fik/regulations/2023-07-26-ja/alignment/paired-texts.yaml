  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000035
    text_sha256: acc8cd89d3db43eec84bf9fdc4232af81ee9755b63209f26d3e7e41e20ec3e7c
    text: '**Article 35:** Nobody is allowed to protest against decisions made by *shinpan-in*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000035
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000036
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000036
  node_type: article
  local_number: '36'
  japanese_title: null
  english_title: Igi
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000036
    text_sha256: b4aa21ae1db3e2ca3ee173805845e11635440d3d865f88d1b4c2c25a8ffc310a
    text: '**第36条:** 監督は、この規則の実施に関して疑義があるときは、その試合者の試合終了までに、審判主任または審判長に対して、異議を申し立てることができる。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000036
    source_pdf_pages:
    - 24
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000036
    text_sha256: 0344cba5ac288cfca2daa187ab8ef254eceb89318bfe8b1a9e5194f5f12bef17
    text: '**Article 36:** In case a *kantoku* about the application of the "Regulations" holds doubts by the *shinpan-in*,
      he or she may file *igi* with the *shinpan-shunin* or *shinpan-cho* before the concerned *shiai* ends.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000036
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000037
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000037
  node_type: article
  local_number: '37'
  japanese_title: 宣告
  english_title: Senkoku
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000037
    text_sha256: fd392a517885b17b7223abada3e90831d6a85604ac3fd825612e0a14e5490064
    text: '**第37条:** 審判員の宣告は、開始・終了・再開・中止・分かれ・有効打突・勝敗・合議・反則などについて行い、その要領は別表のとおりとする。ただし、とくに宣告に際し必要とする場合は、その理由を述べることができる。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000037
    source_pdf_pages:
    - 24
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000037
    text_sha256: a0958c158ce3d58b69d284aafd71f65831d120f6ec911afaa94170da654f8c11
    text: '**Article 37:** The *shinpan-in* shall pronounce the start, end, resumption, suspension, *wakare*, *yuko-datotsu*,
      victory, *gogi*, and *hansoku* in the manner prescribed in Table 1. The *shinpan-in* may explain the *senkoku* if necessary.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000037
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000038
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000038
  node_type: article
  local_number: '38'
  japanese_title: 旗の表示
  english_title: Use of Shinpan-ki
  japanese:
