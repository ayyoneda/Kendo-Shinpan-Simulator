    text: '**Article 4:** The *kendo-gu* shall consist of *men*, *kote*, *do* and *tare*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000004
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
