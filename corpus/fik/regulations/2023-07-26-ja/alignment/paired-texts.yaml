    local_anchor: reg-fik-regulations-ja-000038
    text_sha256: 636ca24b145d59a04828253e545a9d6f5975b4a9e8d78fe1b10da403c53811b8
    text: '**第38条:** 審判員の旗の表示は、中止・分かれ・有効打突・勝敗・合議・反則などについて行い、その要領は別表のとおりとする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000038
    source_pdf_pages:
    - 24
  english:
