    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000009
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000010
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000010
  node_type: article
  local_number: '10'
  japanese_title: 試合の中止、再開
  english_title: Suspension and Resumption of Shiai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000010
    text_sha256: 7fef4676d14f35a793702fff9bce645e17de81f6d02f9cacccf33ae50e2dd0e6
    text: '**第10条:** 試合の中止は、審判員の宣告で行い、再開は、主審の宣告で行う。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000010
    source_pdf_pages:
    - 11
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000010
    text_sha256: be1c712e546d6941aa3d2b6e1e365ce0b97ae050345560ed67b0033ca21e59f7
    text: '**Article 10:** Suspension of a *shiai* can be declared by the *shinpan-in*, while resumption of a *shiai* shall
      be pronounced by the *shushin*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000010
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000011
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000011
  node_type: article
  local_number: '11'
  japanese_title: 試合の中止要請
  english_title: Request for Suspension of Shiai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000011
    text_sha256: ea5c8f55e8ad4591b82c43511df971b97063716c43dce46e059a990ce6a3bf26
    text: '**第11条:** 試合者は、事故などのために試合を継続することができなくなったときは、試合の中止を要請することができる。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000011
    source_pdf_pages:
    - 11
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000011
    text_sha256: 6176c9635e64675a80f0230f0755474fd785617f501f2db428f3887751c31604
    text: '**Article 11:** In case a *shiai-sha* becomes unable to continue fighting due to an accident etc., that *shiai-sha*
      may request a suspension of the *shiai*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000011
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000012
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000012
  node_type: article
  local_number: '12'
  japanese_title: 有効打突
  english_title: Yuko-datotsu
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000012
    text_sha256: 9809a788c9ab6a8e47333cff81da922a5ae44a5adf52988c080a9d0d455c9d39
    text: '**第12条:** 有効打突は、充実した気勢、適正な姿勢をもって、竹刀の打突部で打突部位を刃筋正しく打突し、残心あるものとする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000012
    source_pdf_pages:
    - 11
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000012
    text_sha256: 397c91fe466316f5b074d3781a58298ae5918b9f04c61394a7f8ce36c76b7495
    text: '**Article 12:** A *yuko-datotsu* is defined as an accurate strike or thrust made onto designated targets (*datotsu-bui*)
      of the opponent''s *kendo-gu*. The strike or thrust must be executed in high spirits with correct posture, using the
      striking section (*datotsu-bu*) of the *shinai* with the correct angle (*hasuji*), and followed by *zanshin*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000012
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000013
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000013
  node_type: article
  local_number: '13'
  japanese_title: 竹刀の打突部
  english_title: Datotsu-bu of the Shinai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000013
    text_sha256: 3eec0d8f3b822eb98fb4e79668610984b808eef2f6bd7bf24342d3aa15f0b574
    text: '**第13条:** 竹刀の打突部は、物打を中心とした刃部（弦の反対側）とする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000013
    source_pdf_pages:
    - 12
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000013
    text_sha256: 7a6ec901c095cec45344b92b19bb58f030f2829ce444e262cbad81d46e8c334a
    text: '**Article 13:** The *datotsu-bu* of the *shinai* shall be centered on the striking part (*monouchi*) of the *jinbu*
      on the opposite side of the cord (*tsuru*).'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000013
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000014
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000014
  node_type: article
  local_number: '14'
  japanese_title: 打突部位
  english_title: Datotsu-bui
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000014
    text_sha256: d9b6dbe6b9f4fa79f3b0704a7913a1c3b714accbfdb21380346752d15630cf4c
    text: '**第14条:** 打突部位は、次のとおりとする。（細則第３図参照）


      １．面部（正面および左右面）


      ２．小手部（右小手および左小手）


      ３．胴部（右胴および左胴）


      ４．突部（突き垂れ）'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000014
    source_pdf_pages:
    - 12
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000014
    text_sha256: 6fa12cb6bb52f0cfd195e120f5fa6f3315c2af03431cfe521830192c58888fc4
    text: '**Article 14:** The *datotsu-bui* are as follows (Figure 3):

      1. *Men-bu* (*shomen* and *sayu-men*)

      2. *Kote-bu* (*migi-kote* and *hidari-kote*)

      3. *Do-bu* (*migi-do* and *hidari-do*)

      4. *Tsuki-bu* (*tsuki-dare*)'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000014
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000015
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000015
  node_type: article
  local_number: '15'
  japanese_title: 禁止物質の使用・所持
  english_title: Use or possession of prohibited substances
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000015
    text_sha256: 7c923f6ddfb6dcc3d0fc02ddb8db379b646cb295e167cefaa6221149b06dc2f4
    text: '**第15条:** 禁止物質を使用もしくは所持し、または禁止方法を実施すること。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000015
    source_pdf_pages:
    - 12
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000015
    text_sha256: 05bd1c2a878767dd3aabe90b3a76b657fc9a8a61f02c4841df942e6afcb0777c
    text: '**Article 15:** Using or possessing prohibited substances, or implementing prohibited methods.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000015
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000016
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000016
  node_type: article
  local_number: '16'
  japanese_title: 非礼な言動
  english_title: Insulting or Offensive Behavior
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000016
    text_sha256: 281e841f0b41b2f599d47f5fc3c906cab726132ff772402bfac939b5631b2d3f
    text: '**第16条:** 審判員または相手に対し、非礼な言動をすること。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000016
    source_pdf_pages:
    - 13
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000016
    text_sha256: dce39fa806cb9ff02900dbb15cfb5ed0956f46ce2cce3faf730c0509fc55423b
    text: '**Article 16:** *Shiai-sha* are prohibited from insulting or acting offensively towards *shinpan-in* or opponents.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000016
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000017
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000017
  node_type: article
  local_number: '17'
  japanese_title: 諸禁止行為
  english_title: Miscellaneous Prohibitions
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000017
    text_sha256: 5aa8f2b5d7da6198e0135a2d58e617e05bc2c4c25f49d7ea6b5886561b851fb8
    text: '**第17条:** 試合者が、次の各号の行為をすること。


      １．定められた以外の用具（不正用具）を使用する。


      ２．相手に足を掛けまたは払う。


      ３．相手を不当に場外に出す。


      ４．試合中に場外に出る。


      ５．自己の竹刀を落とす。


      ６．不当な中止要請をする。


      ７．その他、この規則に反する行為をする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000017
    source_pdf_pages:
    - 13
    - 14
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000017
    text_sha256: 89cdc66d9f984320ee7dd99630a8ddde9e149537fc7b836987c7eeabad6b312b
    text: '**Article 17:** *Shiai-sha* are prohibited from engaging in the following acts:

      1. Use of non-regulation kendo equipment.

      2. Tripping the opponent or sweeping their legs.

      3. Unfairly shoving or pushing the opponent out of the *shiai-jo*.

      4. *Jogai*, or stepping out of the *shiai-jo* while the match is in play.

      5. Letting go of the *shinai*.

      6. Requesting for suspension of the *shiai* without a justifiable reason.

      7. Committing other acts that violate the "Regulations".'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000017
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000018
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000018
  node_type: article
  local_number: '18'
  japanese_title: null
  english_title: Taijo
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000018
    text_sha256: c657f864c5d5f37fa0d31fe4963427db0963318683af7065edf8cdc5557494a2
    text: '**第18条:** 第15条、第16条の禁止行為を犯した者は、負けとし、相手に２本を与え、退場を命ずる。退場させられた者の既得本数、既得権は、認めない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000018
    source_pdf_pages:
    - 14
    - 15
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000018
    text_sha256: ebc75f5c2700d3e3cac2214cbaa85ed1b67b3751fea3f9c00a570e9f0de08eb3
    text: '**Article 18:** A *shiai-sha* who commits any of the *hansoku* prescribed in Articles 15 and 16 shall lose the
      *shiai* and be ordered to retire from the *shiai* area (*taijo*). The points or status hitherto gained by the violator
      shall be totally nullified, whereas the opponent will be given two points.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000018
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000019
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000019
  node_type: article
  local_number: '19'
  japanese_title: null
  english_title: Fusei-yogu
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000019
    text_sha256: 29207b4f9b26a7d2d0152d98d0c56a0dea947396622a5e7338b01c0c56bf183f
    text: '**第19条:** 第17条１号の禁止行為をした場合は、次の各号により処置する。ただし、両者同時になしたときは、両者とも負けとし、それぞれの既得本数および既得権を認めない。


      １．不正用具の使用者は、負けとし、相手に２本を与え、既得本数および既得権を認めない。


      ２．前号の処置は、不正用具使用発見以前の試合までさかのぼらない。


      ３．不正用具の使用が発見された者は、その後の試合を継続することができない。ただし、団体戦における補欠の出場は、別に定めのない限り認める。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000019
    source_pdf_pages:
    - 15
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000019
    text_sha256: 3dec3c87a7002d269053997a7161f5097dea7454197dbcc0e771d5038f6c7875
    text: '**Article 19:** A *shiai-sha* who commits the *hansoku* stipulated in Article 17, Item 1 shall receive the penalties
      outlined below. In cases whereby both *shiai-sha* commit such *hansoku*, both shall lose the *shiai* and their points
      or status gained hitherto shall be nullified.

      1. A *shiai-sha* who uses prohibited kendo equipment (*fusei yogu*) shall lose the *shiai*. Any points or status acquired
      hitherto shall be nullified, whereas the opponent will be given two points.

      2. The penalty stipulated in the preceding paragraph will not be retroactive to the preceding *shiai* wherein the use
      of prohibited kendo equipment had not been detected.

      3. A *shiai-sha* who is detected using prohibited equipment will be disallowed from participating in the remaining *shiai*;
      however, the violator may be substituted in *dantai-shiai* unless otherwise stipulated.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000019
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000020
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000020
  node_type: article
  local_number: '20'
  japanese_title: null
  english_title: Others
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000020
    text_sha256: 9758a754899d9b2036ed3bc5bc9df0e0ca050151611b1bf5ff8e7640deb18522
    text: '**第20条:** 試合者が第17条２号ないし７号の行為をした場合は、反則とし、２回犯した場合は、相手に１本を与える。反則は、１試合を通じて積算する。ただし、同時反則によって両者が負けになる場合は相殺し、反則としない。


      ②第17条４号の場合、両者が相前後して、場外に出たときは、先に出た者のみ反則とする。


      ③第17条４号の場合、有効打突を取り消したときは、反則としない。


      ④第17条５号の場合、その直後に相手が打突を加え、有効となったときは、反則としない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000020
    source_pdf_pages:
    - 15
    - 16
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000020
    text_sha256: 179d8b7f5b696722189289efc0c308f9393fcb30734522c0c69c4d59251c7616
    text: '**Article 20:**

      1. In the case whereby a *shiai-sha* commits two *hansoku* stipulated under Article 17, Items 2 to 7, the opponent shall
      be given one point. The number of such *hansoku* shall be cumulative during the round of the concerned *shiai*. However,
      when both *shiai-sha* have gained one point respectively, a second *hansoku* simultaneously committed by both *shiai-sha*
      shall be cancelled (*sosai*) and not subject to penalization.

      2. In the *hansoku* stipulated in Article 17, Item 4, when both *shiai-sha* step out of the *shiai-jo*, the one who
      steps out first shall be subject to penalization.

      3. In the case of Article 17, Item 4, when the *senkoku* for *yuko-datotsu* has been revoked, the infringement shall
      not be subject to penalization.

      4. In the case of the *hansoku* stipulated in Article 17, Item 5, when the opponent scores a *yuko-datotsu* immediately
      after the infringement, it will not be subject to penalization.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000020
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000021
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000021
  node_type: article
  local_number: '21'
  japanese_title: 審判員の構成
  english_title: Composition of the Shinpan Group
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000021
    text_sha256: c7d7a2120bbdbc9bd400233a3a3e84e5b9da898d6d21f8859322198e9a3eb6b4
    text: '**第21条:** 審判に従事する者の構成は、審判長・審判主任（２試合場以上の場合）・審判員とする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000021
    source_pdf_pages:
    - 16
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000021
    text_sha256: 386ab44e51880029074733b1acf311669113dcbf6aeb80937b9919a5048edfdf
    text: '**Article 21:** The *shinpan* group shall consist of the *shinpan-cho*, *shinpan-shunin* (appointed only when two
      or more *shiai-jo* are set up), and *shinpan-in*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000021
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000022
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000022
  node_type: article
  local_number: '22'
  japanese_title: 審判長
  english_title: Shinpan-cho
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000022
    text_sha256: e068e7ac7c24659465cdc71c020fe45e11e856ceb9a1e2904ec288551e97d981
    text: '**第22条:** 審判長は、公正な試合を遂行するための必要な権限を有する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000022
    source_pdf_pages:
    - 16
    - 17
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000022
    text_sha256: bc853480e2431b57f5cc265e848d12aa57d8c7b03d7e61b183b3efa91adc2a52
    text: '**Article 22:** The *shinpan-cho* has the authority to make sure that *shiai* are conducted fairly.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000022
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000023
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000023
  node_type: article
  local_number: '23'
  japanese_title: 審判主任
  english_title: Shinpan-shunin
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000023
    text_sha256: 2b9dd1d51e8c7e681f93e7d14c8e079f818b5b223f6285098784019c40d63d1b
    text: '**第23条:** 審判主任は、審判長を補佐し、それぞれ当該試合場における運営に必要な審判上の権限を有する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000023
    source_pdf_pages:
    - 17
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000023
    text_sha256: 9c639c6a92b93be628815f5f83af20b7b1e03c17f93688577af6d46ae5f24eee
    text: '**Article 23:** The *shinpan-shunin* shall assist the *shinpan-cho*, and has the authority to oversee the *shiai*
      at their respective *shiai-jo*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000023
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000024
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000024
  node_type: article
  local_number: '24'
  japanese_title: 審判員
  english_title: Shinpan-in
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000024
    text_sha256: c9a9ae0f56af0eecf0655ba3df549c575362a460ee5c3f04dd8a52b424e1a82f
    text: '**第24条:** 審判員は、主審１名、副審２名を原則とし、有効打突およびその他の判定については、同等の権限を有する。


      ②主審は、当該試合運営の全般に関する権限を有し、審判旗（以下旗とする）を持って有効打突および反則などの表示と宣告を行う。


      ③副審は、旗を持って有効打突および反則などの表示を行い、運営上主審を補佐する。なお、緊急のときは、試合中止の表示と宣告をすることができる。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000024
    source_pdf_pages:
    - 18
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000024
    text_sha256: c00799c01d5344271af455e9bf0051024592d9d616a3d4f358bdbd7363c7c89b
    text: '**Article 24:**

      1. As a general rule, a *shinpan* group shall consist of a *shushin* and two *fukushin*, each having equal authority
      to decide on *yuko-datotsu* and other matters.

      2. The *shushin* has the authority to administer *shiai*, to signal with *shinpan-ki*, and to pronounce *yuko-datotsu*,
      *hansoku*, etc.

      3. The *fukushin* shall assist the *shushin* in the administration of respective *shiai* by signalling *yuko-datotsu*,
      *hansoku*, etc., with *shinpan-ki*. Further, in the case of emergency, either *fukushin* may signal and pronounce suspension
      of the *shiai*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000024
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000025
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000025
  node_type: article
  local_number: '25'
  japanese_title: 係員
  english_title: Kakari-in Group
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000025
    text_sha256: fd7a8f81b530f450a2cfac76050bf295dbbde169d5b7109cfeb33f939d176660
    text: '**第25条:** 試合運営上、時計係・掲示係・記録係・選手係を置く。その構成および任務は、細則に定める。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000025
    source_pdf_pages:
    - 18
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000025
    text_sha256: e833a733d994aff04cbb291f1fc5d8f4767665b4796bab9a0af640abc881850f
    text: '**Article 25:** In order to properly manage *shiai*, a group of *kakari-in* consisting of time keepers, scoreboard
      recorders, score recorders, and *shiai-sha* callers should be present at each *shiai-jo*. The composition and duties
      thereof are outlined in the "Subsidiary Rules".'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000025
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000026
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000026
  node_type: article
  local_number: '26'
  japanese_title: 有効打突の決定
  english_title: Decisions on Yuko-datotsu
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000026
    text_sha256: dc98eea46cf88501aa124d2b981a7a9a58dc0be061c33038846dacbaf221d0d1
    text: '**第26条:** 有効打突の決定は、次による。


      １．２名以上の審判員が有効打突の表示をしたとき。


      ２．１名が有効打突の表示をし、他の審判員が棄権の表示をしたとき。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000026
    source_pdf_pages:
    - 20
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000026
    text_sha256: d9731556e7a20e970fdf6965d3415374b35cfc6b98be5e74ab555d1f3723a9c7
    text: '**Article 26:** A *datotsu* shall be considered as *yuko* and awarded one point in the following cases:

      1. When two or three *shinpan-in* have signalled *yuko-datotsu*.

      2. When one *shinpan-in* has signalled *yuko-datotsu*, and the others have signalled abstention.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000026
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000027
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000027
  node_type: article
  local_number: '27'
  japanese_title: 有効打突の取り消し
  english_title: Torikeshi of Yuko-datotsu
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000027
    text_sha256: 47a49de318fa06874e1a301e697b8c74cc9ba1d2109eaa47d56c283667c2f8ea
    text: '**第27条:** 試合者に不適切な行為があった場合は、主審が有効打突の宣告をした後でも、審判員は合議の上、その宣告を取り消すことができる。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000027
    source_pdf_pages:
    - 20
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000027
    text_sha256: d81415b21cd40703f1871c5ec06679a579668193613e606c776791c68d2bb7cb
    text: '**Article 27:** In the case where a *shiai-sha* has committed an improper act, the decision of *yuko-datotsu* may
      be revoked upon *gogi*, even after its *senkoku*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000027
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000028
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000028
  node_type: article
  local_number: '28'
  japanese_title: 有効打突などの錯誤
  english_title: Mistakes in Decisions for Yuko-datotsu and Other Judgements
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000028
    text_sha256: 76830106b30d219aa3c7f5d49562d9cae8258b3fd85df86dc0ee24455e0d6669
    text: '**第28条:** 審判員が有効打突などの判定に疑義がある場合は、合議の上、その是非を決定する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000028
    source_pdf_pages:
    - 20
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000028
    text_sha256: 2ec4c4f46d8780155652facd6efacfc3356b71ec9a31dceeea22a08e348c4f48
    text: '**Article 28:** In cases where the *shinpan-in* have doubts about a decision for *yuko-datotsu* or something else,
      a *gogi* shall be called wherein the *shinpan-in* shall come to a decision.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000028
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000029
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000029
  node_type: article
  local_number: '29'
  japanese_title: 審判方法
  english_title: Procedures for Shinpan
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000029
    text_sha256: 0a84db963b57a06947a257cdb6bb2dd273abc27cbf14c244b840a29c998fbcff
    text: '**第29条:** 審判員は、次の方法により審判を行う。


      １．審判員のうち、１名が有効打突の表示をした場合は、他の審判員は自己の判断を直ちに表示しなければならない。


      ２．主審は、有効打突が決定し、または試合を中止した場合は、試合者を開始線に戻した後、試合を再開させる。


      ３．審判員は、反則を認めた場合、試合を中止させ、旗を直ちに表示しなければならない。ただし、反則の事実が不明瞭なときは、合議の上、その有無を決定する。


      ４．主審は、つば（鍔）競り合いがこうちゃく（膠着）した場合は、試合者をその場で分け、直ちに試合を継続させる。


      ５．主審は、試合者が中止を要請した場合は、中止を宣告した後、その理由を質す。


      ６．判定によって勝敗を決する場合は、審判員は、主審の「判定」の宣告と同時に旗で表示を行う。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000029
    source_pdf_pages:
    - 21
    - 22
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000029
    text_sha256: 763321aab459e6af11f6059248c58931e35aa15c429bb9ff22eeaa21ec5ee89d
    text: '**Article 29:** *Shinpan-in* shall adjudicate *shiai* in the following manner:

      1. In the case where a *shinpan-in* has signalled *yuko-datotsu*, the other *shinpan-in* must immediately signal their
      judgments.

      2. In the case where a *yuko-datotsu* has been awarded, or the *shiai* has been suspended, the *shushin* will get the
      *shiai-sha* to return to the *kaishi-sen* and then resume the *shiai*.

      3. In cases whereby the *shinpan-in* have identified a *hansoku*, the *shinpan-in* shall immediately suspend the *shiai*
      and signal to that effect with their *shinpan-ki*. However, if the *hansoku* was not obvious, the *shinpan-in* shall
      call *gogi* to discuss the matter.

      4. In the case where *tsubazeriai* has come to a stalemate, the *shushin* shall separate the *shiai-sha* on the spot
      (*wakare*) and then resume the *shiai*.

      5. In the case where a *shiai-sha* has requested stoppage, the *shushin* shall pronounce suspension of the *shiai* and
      ask the *shiai-sha* for the reason.

      6. When a victory must be decided by *hantei*, all of the *shinpan-in* shall simultaneously signal their decision for
      the winner with their *shinpan-ki* upon the *shushin*''s *senkoku* of "Hantei".'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000029
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000030
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000030
  node_type: article
  local_number: '30'
  japanese_title: 負傷または事故
  english_title: Injury or Accident
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000030
    text_sha256: f96f91db9ed6020ce946fb46dd0cb388669a6522c58afe9fbbdae5d9e727b37b
    text: '**第30条:** 負傷または事故などにより試合が継続できない場合は、その原因を質し、次の処置をする。


      １．試合継続の可否判断は、医師の意見を徴し審判員の総合判断とする。その処理に要する時間は、原則として５分以内とする。


      ２．負傷により試合が継続できないとき、その原因が一方の故意および過失による場合は、その原因を起こした者を負けとし、その原因が明瞭でない場合は、試合不能者を負けとする。


      ３．負傷または事故者として処理された者は、医師および審判員の判断により、その後の試合に出場することができる。


      ４．加害者として負けとされた者は、その後の試合に出場することができない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000030
    source_pdf_pages:
    - 22
    - 23
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000030
    text_sha256: be8b6b1951340d6439f070cee2d9a1e382430e73df20ada91e1f16f7b5e5ff04
    text: '**Article 30:** In case a *shiai-sha* is unable to continue the *shiai* due to injury or an accident, the *shinpan-in*
      shall ascertain the cause and handle the matter in the following manner:

      1. The *shinpan-in* shall determine whether to continue the *shiai* after consulting with a doctor. As a general rule,
      the *shinpan-in* should spend no more than five minutes handling an accident.

      2. In case a *shiai-sha* is unable to continue the *shiai* due to an injury, if the opponent is deemed to be responsible
      for the accident, whether intentionally or not, the opponent shall lose the *shiai*. If the cause of the accident cannot
      be ascertained, the injured *shiai-sha* (*shiai-funo-sha*) shall lose the *shiai*.

      3. A *shiai-sha* who becomes incapacitated due to an injury or an accident may be reinstated in later *shiai if a doctor
      and the *shinpan-in* permit him or her to do so.

      4. A *shiai-sha* who loses a *shiai* through causing an accident will not be allowed to participate in following *shiai*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000030
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
