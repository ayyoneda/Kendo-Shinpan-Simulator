  japanese_title: 本規則の目的
  english_title: The Purpose of the "Regulations"
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000001
    text_sha256: 7a06d8f98dc4c22fac37485778fcc0446159b6d24d6b052f01857cf7aee183e1
    text: '**第1条:** この規則は、全日本剣道連盟の剣道試合につき、剣の理法を全うしつつ、公明正大に試合をし、適正公平に審判することを目的とする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000001
    source_pdf_pages:
    - 6
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000001
    text_sha256: 0b40bbb7770cf9b935e5f78d639cd925258a7805f1d33e73f58f60284177ff98
    text: '**Article 1:** The purpose of the "Regulations" is to get *shiai-sha* to compete fairly in *shiai* of the INTERNATIONAL
      KENDO FEDERATION (FIK), in accordance with the principles of the sword, and to properly referee the *shiai* without
      prejudice.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000001
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000002
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000002
  node_type: article
  local_number: '2'
  japanese_title: 試合場
  english_title: Shiai-jo
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000002
    text_sha256: 4ec9ad13028b16fde11963697501498837511449680989b9747fd8bdd9231ec5
    text: '**第2条:** 試合場の基準は次のとおりとし、床は板張を原則とする。


      １．試合場は、境界線を含み一辺を９メートルないし11メートルの、正方形または長方形とする。


      ２．試合場の中心は×印とし、開始線は、中心より均等の位置（距離）に左右１本ずつ表示する。各線の長さおよび開始線間の距離は細則で定める。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000002
    source_pdf_pages:
    - 6
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000002
    text_sha256: 15b3d8ed065106148745c3169f9e08f709aa98d4189ece0ea51d61a9e988cb4f
    text: '**Article 2:** As a rule, the *shiai-jo* should have a wooden floor, and its specifications shall be as follows:

      1. The *shiai-jo* should be a square or a rectangle with sides of 9 to 11 meters in length inclusive of the width of
      the line.

      2. The center of the *shiai-jo* should be marked by a cross, and two *kaishi-sen* should be marked on both sides of
      the center at an equal distance. The length of the *kaishi-sen* and the distance between them are stipulated in the
      "Subsidiary Rules."'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000002
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000003
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000003
  node_type: article
  local_number: '3'
  japanese_title: 竹刀
  english_title: Shinai
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000003
    text_sha256: 7b10f320e9d386314f2a9938da707a25b14f8df188fbd87e3dd5b47d564aefa1
    text: '**第3条:** 竹刀は、竹または全日本剣道連盟が認めた竹に代わる化学製品のものとする。竹刀の構造、長さ、重さ、太さ、つば（鍔）の規格などは、細則で定める。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000003
    source_pdf_pages:
    - 6
    - 7
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000003
    text_sha256: 91bbc41b5baadbbbbde8e38b437db8d43f3878a3eb332dd800fb9bfc69f97895
    text: '**Article 3:** The *shinai* should be made from bamboo, or from synthetic material as a substitute for bamboo that
      is approved by the ALL JAPAN KENDO FEDERATION. The structure, length, weight, and diameter of the *shinai*, and specifications
      for *tsuba* are stipulated in the "Subsidiary Rules."'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000003
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
