  semantic_review_status: pending
- alignment_id: alignment:kkp:subsidiary-rule:fik.regulations:000001
  pair_type: provision
  canonical_id: kkp:subsidiary-rule:fik.regulations:000001
  node_type: subsidiary-rule
  local_number: '1'
  japanese_title: 試合場
  english_title: Shiai-jo
  japanese:
    path: text/subsidiary-rules.ja.md
    local_anchor: sub-fik-regulations-ja-000001
    text_sha256: 442b7e8c5d61454eab8099de5a0035d8875d2080da6059fd58ff461d7f49d6d6
    text: '**第1条:** 規則第２条（試合場）は、次のとおりとする。


      １．試合場の外側に原則として1.5メートル以上の余地を設ける。


      ２．各線は、幅５センチメートルないし10センチメートルとし、白線を原則とする。


      ３．試合場の中心（×印）、開始線の長さおよび開始線間の距離などは、第１図のとおりとする。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:subsidiary-rule:000001
    source_pdf_pages:
    - 6
  english:
    path: text/subsidiary-rules.en.md
    local_anchor: sub-fik-regulations-000001
    text_sha256: b1fed5784fb271eb038f88b2e04b0e85f442108b26c25c95c8e26c86f1749959
    text: '**Article 1:** The specifications of the *shiai-jo* prescribed in Article 2 of the "Regulations" are as follows:

      1. A space of at least 1.5 meters wide should be kept outside of the *shiai-jo*.

      2. The width of the lines should be 5 to 10 centimeters, and the color thereof should be white as a general rule.

      3. The cross at the center of the *shiai-jo*, the length of the *kaishi-sen* and the distance between them are shown
      in Figure 1.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:subsidiary-rule:000001
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
