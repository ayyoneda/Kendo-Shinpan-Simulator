    text: '**Article 38:** The *shinpan-in* shall use *shinpan-ki* to motion suspension, *wakare*, *yuko-datotsu*, victory,
      *gogi*, and *hansoku* in the manner prescribed in Table 1.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000038
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
