    text: '**Article 33:** The points or acquired status of the offender who loses a *shiai* due to Article 30, Item 2 shall
      be invalidated.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000033
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000034
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000034
  node_type: article
  local_number: '34'
  japanese_title: 合議
  english_title: Gogi
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000034
    text_sha256: 5a5aff2cf0718ea58eff68fc800315aed5aadf01529be5a6d0a5b2a2ed0ee696
    text: '**第34条:** 審判員は、合議を必要とするときは、試合を中止し、試合場中央で、合議を行う。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000034
    source_pdf_pages:
    - 23
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000034
    text_sha256: aed9b381672947fc1a82e1e1f1b39464d0a6acfc492d7996b7216b5f38dca841
    text: '**Article 34:** In case *gogi* is deemed necessary, the *shinpan-in* shall suspend the *shiai*, call *gogi*, and
      discuss the matter in the centre of the *shiai-jo*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000034
  structural_alignment: same_official_provision_type_and_number
  semantic_review_status: pending
- alignment_id: alignment:kkp:article:fik.regulations:000035
  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000035
  node_type: article
  local_number: '35'
  japanese_title: 異議の申し立て
  english_title: Igi
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000035
    text_sha256: 56c96ecec2fe8a7bfa0071631fbc6639b1ab0b7efa422300612ba0ad6912af30
    text: '**第35条:** 何人も、審判員の判定に対し、異議の申し立てをすることができない。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000035
    source_pdf_pages:
