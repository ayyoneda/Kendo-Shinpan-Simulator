  pair_type: provision
  canonical_id: kkp:article:fik.regulations:000039
  node_type: article
  local_number: '39'
  japanese_title: null
  english_title: Supplementary Matters
  japanese:
    path: text/regulations.ja.md
    local_anchor: reg-fik-regulations-ja-000039
    text_sha256: 72773a45718711873aa2dd8955635fdd5b1655058fc1f686c032192a05c573f9
    text: '**第39条:** この規則に定められていない事項が発生した場合は、審判員は合議し、審判主任または審判長に図って処理する。'
    node_version_id: kkp:node:fik.regulations:2023-07-26:ja:article:000039
    source_pdf_pages:
    - 24
  english:
    path: text/regulations.en.md
    local_anchor: reg-fik-regulations-000039
    text_sha256: acbfa880c1f79a8ad36762afb6fb3a39b73b1cb3e7e68634550ce096c0246056
    text: '**Article 39:** In case matters that have not been provided for in the "Regulations" occur, the *shinpan-in* shall
      decide by *gogi*, subject to the approval of the *shinpan-shunin* or *shinpan-cho*.'
    node_version_id: kkp:node:fik.regulations:2023-07-26:en:article:000039
